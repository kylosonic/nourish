<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-background/80 backdrop-blur-md">
<div class="flex justify-between items-center px-container-margin py-base max-w-[1200px] mx-auto">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="close">close</span>
</button>
</div>
<div class="font-display-lg text-display-lg text-primary tracking-tight">
                Nourish
            </div>
<div class="w-8"></div> <!-- Placeholder for balance -->
</div>
</header>
<main class="flex-grow w-full max-w-[1200px] mx-auto px-container-margin py-section-gap pb-32">
<div class="flex flex-col lg:flex-row gap-section-gap">
<!-- Left Column: Image & Detection Status -->
<div class="w-full lg:w-1/2 flex flex-col gap-gutter">
<div class="relative w-full aspect-square rounded-xl overflow-hidden shadow-[0_4px_12px_rgba(49,48,48,0.04)] bg-surface-container">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A top-down, high-quality photograph of a traditional Ethiopian meal featuring Injera, Doro Wot (spicy chicken stew), and a vibrant side salad. The lighting is soft, natural, and bright, highlighting the rich red tones of the stew, the fresh greens of the salad, and the porous texture of the injera bread. The scene is set on a clean, minimalist white table setting, conveying a sense of premium quality and modern culinary presentation." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeQ2r018VpHHZ8Mlgf6TtJLjyREvnGCrKhXgVke0uqvH9PVPxjK44UcVCq2cva9yCM_gE7VqB2rdaFEkb8EK9S9Ef8kgWY6GTAeqv04THJjOyZ_muJLZ7mvBw3WWJlj8NdwTpza73Hm17zyp1lBYURh2nbZLo0PtkgMwn1DAoVLa8FPnegUPG0E-rXeJrVxp2GY3SXx_yTax0n0Y1G-ZyvU87AlmJ9dXUl_CguH-0ZKarQPC9gHJQS"/>
<!-- AI Scanning Overlay Effect -->
<div class="absolute inset-0 border-2 border-primary-container rounded-xl pointer-events-none opacity-50"></div>
<div class="absolute top-4 left-4 bg-surface/90 backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-primary-container text-sm" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-caps text-label-caps text-on-surface">SCAN COMPLETE</span>
</div>
</div>
<div class="flex justify-between items-center bg-surface-container-low p-4 rounded-lg">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">AI CONFIDENCE</span>
<span class="font-headline-md text-headline-md text-primary">HIGH (94%)</span>
</div>
<button class="font-label-caps text-label-caps text-primary hover:opacity-80 transition-opacity flex items-center gap-1">
<span class="material-symbols-outlined text-lg" data-icon="edit">edit</span>
                        ADJUST
                    </button>
</div>
</div>
<!-- Right Column: Data & Actions -->
<div class="w-full lg:w-1/2 flex flex-col gap-section-gap">
<!-- Summary Card -->
<div class="bg-surface rounded-xl shadow-[0_4px_12px_rgba(49,48,48,0.04)] p-6 border border-surface-variant">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-6">Meal Summary</h2>
<div class="flex items-baseline gap-2 mb-8 border-b border-surface-variant pb-6">
<span class="font-metric-xl text-metric-xl text-on-surface">820</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">kcal</span>
</div>
<div class="grid grid-cols-3 gap-4">
<!-- Protein -->
<div class="flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">PROTEIN</span>
<span class="font-headline-md text-headline-md text-on-surface">42g</span>
<div class="w-full bg-surface-container-highest rounded-full h-2 mt-1">
<div class="bg-primary-container h-2 rounded-full" style="width: 70%"></div>
</div>
</div>
<!-- Carbs -->
<div class="flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">CARBS</span>
<span class="font-headline-md text-headline-md text-on-surface">86g</span>
<div class="w-full bg-surface-container-highest rounded-full h-2 mt-1">
<div class="bg-secondary-container h-2 rounded-full" style="width: 85%"></div>
</div>
</div>
<!-- Fat -->
<div class="flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">FAT</span>
<span class="font-headline-md text-headline-md text-on-surface">31g</span>
<div class="w-full bg-surface-container-highest rounded-full h-2 mt-1">
<div class="bg-tertiary-container h-2 rounded-full" style="width: 45%"></div>
</div>
</div>
</div>
</div>
<!-- Detected Items List -->
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-4">DETECTED INGREDIENTS</h3>
<div class="flex flex-col gap-3">
<!-- Item 1 -->
<div class="bg-surface rounded-lg p-4 flex justify-between items-center border border-surface-variant shadow-sm hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="restaurant">restaurant</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">INJERA</span>
<span class="font-body-md text-body-md text-on-surface-variant">Traditional Teff Bread</span>
</div>
</div>
<div class="text-right flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">120g</span>
<span class="font-label-caps text-label-caps text-primary">~180 kcal</span>
</div>
</div>
<!-- Item 2 -->
<div class="bg-surface rounded-lg p-4 flex justify-between items-center border border-surface-variant shadow-sm hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="set_meal">set_meal</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">DORO WOT</span>
<span class="font-body-md text-body-md text-on-surface-variant">Spicy Chicken Stew</span>
</div>
</div>
<div class="text-right flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">220g</span>
<span class="font-label-caps text-label-caps text-primary">~510 kcal</span>
</div>
</div>
<!-- Item 3 -->
<div class="bg-surface rounded-lg p-4 flex justify-between items-center border border-surface-variant shadow-sm hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="eco">eco</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface">SALAD</span>
<span class="font-body-md text-body-md text-on-surface-variant">Mixed Greens &amp; Tomato</span>
</div>
</div>
<div class="text-right flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">80g</span>
<span class="font-label-caps text-label-caps text-primary">~130 kcal</span>
</div>
</div>
</div>
</div>
<!-- CTA Area -->
<div class="flex flex-col sm:flex-row gap-4 mt-4">
<button class="flex-1 bg-primary text-on-primary font-headline-md text-headline-md py-4 px-6 rounded-xl shadow-md hover:bg-primary/90 transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check">check</span>
                        CONFIRM MEAL
                    </button>
<button class="flex-1 bg-surface-container text-on-surface font-headline-md text-headline-md py-4 px-6 rounded-xl border border-outline-variant hover:bg-surface-container-high transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="edit_square">edit_square</span>
                        EDIT
                    </button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed as this is a transactional flow) -->
<!-- Navigation shell is intentionally omitted because this is a focused, task-based screen (Confirming a Scan) with a clear 'Close' action top left. -->
</body></html>
