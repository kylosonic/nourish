<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<title>Nourish - Scan Meal</title>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>

            darkMode: "class",
            theme: {

                        "on-secondary-container": "#684000",
                        "surface-container-low": "#f6f3f2",
                        "inverse-on-surface": "#f3f0ef",
                        "secondary-container": "#fea619",
                        "primary": "#006c49",
                        "surface": "#fcf9f8",

                        "surface-tint": "#006c49",

                        "error": "#ba1a1a",

                        "surface-variant": "#e5e2e1",
                        "surface-dim": "#dcd9d9",
                        "outline-variant": "#bbcabf",
                        "surface-container-lowest": "#ffffff",

                        "secondary": "#855300",
                        "on-tertiary-container": "#711419",
                        "error-container": "#ffdad6",
                        "primary-container": "#10b981",
                        "secondary-fixed": "#ffddb8",
                        "tertiary-container": "#fc7c78",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "40px",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "metric-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                }
            }
        }

</head>
<body class="bg-inverse-surface h-screen w-screen overflow-hidden flex flex-col relative select-none">
<!-- Camera Viewfinder Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A top-down view of a beautifully plated Ethiopian meal, featuring injera and vibrant stews like doro wat and misir wat, set on a clean, modern wooden table. Soft, natural lighting from a nearby window creates gentle shadows. High resolution, premium editorial food photography style with a slight depth of field blurring the edges." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDMN-EPXXGigwc364gqiRWvuRt0Tl5j3tqaGEJ4orDNqXOdUIFzFLUmc2HjuNp29XJsx_j8DDkxnH22t5XBb9M4jT8HYQwbHTHEKz2lEPLi516ozTAsjDoKR9jZWu7y-09MvqVbzLepLfdFv_0sdJQ-ZvNSbcoOqLuZkCEBhY1rHhI6UwM05D2FcjMvkWz1GjAzC6ZctKpTyMQcHjud1al6E6DPl3ikbl3fSriBN4hiDYUCHVC69u_A')"></div>
<!-- Dark Gradient Overlay for Top/Bottom visibility -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-black/60 via-transparent to-black/80 pointer-events-none"></div>
<!-- Top UI Container -->
<div class="relative z-10 flex items-center justify-between px-container-margin py-container-margin w-full pt-12">
<!-- Close Button -->
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md text-white hover:bg-black/60 transition-colors active:scale-95 cursor-pointer">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
<!-- Instruction Text -->
<div class="px-6 py-2 rounded-full bg-black/40 backdrop-blur-md">
<span class="font-body-md text-body-md text-white">Fit your whole meal in the frame</span>
</div>
<!-- Empty div for flex spacing balance -->
<div class="w-12 h-12"></div>
</div>
<!-- Framing Guide -->
<div class="flex-grow flex items-center justify-center relative z-10 pointer-events-none px-12">
<!-- Corner brackets framing the center -->
<div class="w-full max-w-sm aspect-square relative opacity-70">
<!-- Top Left -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-2 border-l-2 border-white rounded-tl-xl"></div>
<!-- Top Right -->
<div class="absolute top-0 right-0 w-12 h-12 border-t-2 border-r-2 border-white rounded-tr-xl"></div>
<!-- Bottom Left -->
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-2 border-l-2 border-white rounded-bl-xl"></div>
<!-- Bottom Right -->
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-2 border-r-2 border-white rounded-br-xl"></div>
<!-- Central Reticle (Optional, subtle) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full border border-white/50"></div>
</div>
</div>
<!-- Bottom Controls Container -->
<div class="relative z-10 w-full px-container-margin pb-12 pt-8 flex items-center justify-between">
<!-- Gallery Preview (Left) -->
<button class="w-14 h-14 rounded-lg overflow-hidden border-2 border-white/50 hover:border-white transition-colors active:scale-95 bg-surface-variant flex-shrink-0 cursor-pointer">
<img class="w-full h-full object-cover" data-alt="A small thumbnail image showing a previously captured photo of a vibrant green salad in a white bowl, shot from above in soft natural light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMT62K9djWMZDBi_rDCH3iRJvXe8aC85-XFQIOZYPw8U8N83z5fQA_zCSXwz5RjvumXIwUel3LziWUnniq8BqG3WxK_Ht98c_rTxgOYtePFRDXSD1-65U2pdCn2WRKVt0BG2epTWZ9VPdxIt4sXPDauAhQn7Few0HH2_kYDxYxj9hB1oxp27VYG8h6v6qhY9JaHLuOC4l6IGiAQCxpzGD3bUMAObBv3-8H_RG12rRD-Kek1Hz4bzK5"/>
</button>
<!-- Main Shutter Button (Center) -->
<button class="relative flex items-center justify-center group active:scale-95 transition-transform duration-150 cursor-pointer" id="shutter-btn">
<!-- Outer Ring -->
<div class="absolute inset-0 rounded-full border-[3px] border-white w-20 h-20 -left-1 -top-1"></div>
<!-- Inner Circle (Emerald Green) -->
<div class="w-[72px] h-[72px] rounded-full bg-primary group-hover:bg-primary-container transition-colors shadow-lg shadow-black/20 z-10"></div>
</button>
<!-- Flash Toggle (Right) -->
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md text-white hover:bg-black/60 transition-colors active:scale-95 flex-shrink-0 cursor-pointer">
<span class="material-symbols-outlined" data-icon="flash_on" style="font-size: 28px;">flash_on</span>
</button>
</div>
<!-- Simulated Flash Effect Container -->
<div class="absolute inset-0 bg-white z-50 opacity-0 pointer-events-none transition-opacity duration-75" id="flash-overlay"></div>
<script>
        // Simple shutter animation script
        document.getElementById('shutter-btn').addEventListener('click', function() {
            const flash = document.getElementById('flash-overlay');
            // Trigger flash
            flash.style.opacity = '1';
            
            // Fade out flash
            setTimeout(() => {
                flash.style.opacity = '0';
            }, 100);
            
            // Haptic feedback if supported
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        });
    </script>
</body></html>
