<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<!-- Progress Header (Transactional flow, nav suppressed) -->
<header class="px-container-margin py-container-margin flex flex-col gap-4 max-w-[600px] mx-auto w-full pt-8 md:pt-12">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 -ml-2 rounded-full hover:bg-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-[33%] rounded-full transition-all duration-700 ease-out"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">1 OF 3</span>
</div>
</header>
<!-- Main Content Canvas -->

<div class="mb-section-gap">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-3 tracking-tight">
                What do you usually eat?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                We'll use this to build your baseline nutritional targets and suggest relevant meals.
            </p>
</div>
<form class="flex flex-col gap-4 flex-1">
<!-- Option: Ethiopian -->
<label class="relative cursor-pointer group block">
<input checked="" class="peer sr-only" name="diet_preference" type="radio" value="ethiopian"/>
<div class="flex items-center p-3 rounded-xl border-2 border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-primary-container/5 transition-all duration-200 hover:border-outline shadow-[0_4px_12px_rgba(49,48,48,0.02)] hover:shadow-[0_8px_16px_rgba(49,48,48,0.06)]">
<div class="w-[88px] h-[88px] rounded-lg overflow-hidden shrink-0 relative bg-surface-variant">

</div>
<div class="ml-4 flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Ethiopian</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Traditional dishes like Injera, wot, and tibs.</p>
</div>
<div class="ml-2 mr-2 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors duration-200 peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 transition-opacity duration-200 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Option: Mixed -->
<label class="relative cursor-pointer group block">
<input class="peer sr-only" name="diet_preference" type="radio" value="mixed"/>
<div class="flex items-center p-3 rounded-xl border-2 border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-primary-container/5 transition-all duration-200 hover:border-outline shadow-[0_4px_12px_rgba(49,48,48,0.02)] hover:shadow-[0_8px_16px_rgba(49,48,48,0.06)]">
<div class="w-[88px] h-[88px] rounded-lg overflow-hidden shrink-0 relative bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A bright, modern food photograph showing a fusion meal blending traditional and modern elements. A beautifully plated bowl containing a mix of ancient grains, grilled chicken, and a side of lightly spiced lentils. The aesthetic is clean, healthy, and premium, shot from a 45-degree angle with shallow depth of field. Natural window light illuminates the fresh ingredients against a pristine white marble background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFj_x7FG09474aqH89E3epQS8gHGG62lmys6j2XekP_kfWFF963XXGFbHuCzro1U65v3U_4x8z5_eiFMHsJk5k4tswGU-KLa9GjYZxieRiAHkuy57hjqN2g3c4_oA4v4B5oqKDNORdhnPTYTkp9CDiOKvh-mX-_PsH6XSVjfGE0W9alCeNosKobLYi8bJ7udP1ATwWEZk1tyfmOynnz6bCuwGVfx1tTdQ8d-aAhQpV-5sOOQg3UmRq"/>
</div>
<div class="ml-4 flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Mixed</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">A balance of traditional meals and modern preps.</p>
</div>
<div class="ml-2 mr-2 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors duration-200 peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 transition-opacity duration-200 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>

<div class="flex items-center p-3 rounded-xl border-2 border-outline-variant bg-surface-container-lowest peer-checked:border-primary peer-checked:bg-primary-container/5 transition-all duration-200 hover:border-outline shadow-[0_4px_12px_rgba(49,48,48,0.02)] hover:shadow-[0_8px_16px_rgba(49,48,48,0.06)]">
<div class="w-[88px] h-[88px] rounded-lg overflow-hidden shrink-0 relative bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A minimalist, high-end editorial shot of a healthy international meal. A perfectly plated Mediterranean quinoa salad with avocado, cherry tomatoes, and grilled salmon on a matte ceramic plate. The lighting is crisp and bright, emphasizing the vibrant colors and fresh textures. The background is an out-of-focus soft white, evoking a modern, health-conscious lifestyle aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHy5RWTkkfpFZY4YqKKaW-qw-zpOgtr2ESgU9emJYQ3ZN6AW3z3LvXaO0IIjnVf7cjb1I8jYmiaJBG6A1op1L8GbDNYnF5QPr937B0DxnQ9enpSXrB9p4cGg46BtsuuPlR8-nHCpo8bc9Vtm4PT7c4izaCzewjHqVbGQLOoRkzP4NMK62AQP6Yf7SLTAXXmSVP3_cFSN07nNdhFKzrYuKofaATcVtq8C_p2usqSIdDGKEn8idRI5pA"/>
</div>
<div class="ml-4 flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface">International</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Global cuisine, pastas, salads, and proteins.</p>
</div>
<div class="ml-2 mr-2 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors duration-200 peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 transition-opacity duration-200 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
