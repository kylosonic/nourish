<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A macro shot of a fresh green leaf with morning dew drops catching the early sunlight. The lighting is soft and bright, emphasizing health, vitality, and purity. The mood is calm and refreshing. Minimalist editorial style, high resolution." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDhbVMLummeVibafw9XlT-nqzRhv28Trbjdl3wz7t5IwWTRvWItJscVphSqaGDWMNYqJMMBTd0PKWb-OnoOMuYNtMgx1R36nfr1gsnexeWdNAMn5WvWxyL660ShirOgXRgNoNNtEB-JMBP5VtnYHeD40P39Apflwh0Q0GHBncNS0qDXaIot5R1baWTVgjkxEjsL-QyLTOFoBYMfg2GSMGun5BN7s0aai-iJxnrPbYpAkY1obmtvb_2"/>

<h1 class="font-display-lg text-display-lg text-primary">Nourish</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="flex-1 px-container-margin py-section-gap max-w-[1200px] mx-auto w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-6">Today's Progress</h2>
<div class="bg-surface-container-low rounded-xl p-6 shadow-sm mb-section-gap">
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Calories</p>
<div class="flex items-end gap-2">
<span class="font-metric-xl text-metric-xl text-primary">1,240</span>
<span class="font-body-md text-body-md text-on-surface-variant mb-1">/ 2,000</span>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 flex justify-around items-center px-gutter pb-6 pt-2 bg-surface/80 backdrop-blur-md shadow-[0_-4px_12px_rgba(49,48,48,0.04)] z-50 rounded-t-xl hidden md:flex">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-colors rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-3 py-1 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>
<span class="font-label-caps text-label-caps">Scan</span>
</a>
</nav>

<div class="flex justify-between items-center mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface">What did you eat?</h2>
<button class="text-on-surface-variant hover:bg-surface-container-high rounded-full p-2 transition-colors md:hidden">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-xl border border-transparent hover:border-outline-variant hover:bg-surface-container-highest transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-4 group-hover:scale-110 transition-transform duration-200">

</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-wider">TAKE PHOTO</span>

<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary mb-4 group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="image">image</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-wider">CHOOSE PHOTO</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-xl border border-transparent hover:border-outline-variant hover:bg-surface-container-highest transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary mb-4 group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="edit_note">edit_note</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-wider">DESCRIBE MEAL</span>
</button>

<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-4 group-hover:scale-110 transition-transform duration-200">

<span class="font-label-caps text-label-caps text-on-surface tracking-wider">USE VOICE</span>
</button>

<div class="w-12 h-12 rounded-full bg-outline-variant/30 flex items-center justify-center text-on-surface-variant mb-4 group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="search">search</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-wider">SEARCH FOOD</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-xl border border-transparent hover:border-outline-variant hover:bg-surface-container-highest transition-all duration-200 group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary mb-4 group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-3xl" data-icon="barcode_scanner">barcode_scanner</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface tracking-wider">SCAN BARCODE</span>
</button>
