<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nourish - Preferred Pace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#711419",
                        "on-secondary-fixed": "#2a1700",
                        "secondary-container": "#fea619",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-primary-fixed-variant": "#005236",
                        "primary-container": "#10b981",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#410005",
                        "surface-variant": "#e5e2e1",
                        "error-container": "#ffdad6",
                        "surface": "#fcf9f8",
                        "surface-bright": "#fcf9f8",
                        "tertiary-container": "#fc7c78",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed": "#6ffbbe",
                        "secondary": "#855300",
                        "surface-container-low": "#f6f3f2",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-dim": "#dcd9d9",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdad7",
                        "on-primary-fixed": "#002113",
                        "on-background": "#1c1b1b",
                        "inverse-surface": "#313030",
                        "surface-tint": "#006c49",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-tertiary-fixed-variant": "#842225",
                        "outline": "#6c7a71",
                        "on-surface-variant": "#3c4a42",
                        "primary": "#006c49",
                        "background": "#fcf9f8",
                        "on-surface": "#1c1b1b",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#a43a3a",
                        "secondary-fixed": "#ffddb8",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#4edea3",
                        "on-primary-container": "#00422b",
                        "inverse-primary": "#4edea3",
                        "surface-container": "#f0eded",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bbcabf",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "on-secondary-container": "#684000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "section-gap": "40px",
                        "gutter": "16px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "metric-xl": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "metric-xl": ["40px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Custom radio button styles for cards */
        input[type="radio"]:checked + div {
            border-color: theme('colors.primary');
            background-color: theme('colors.surface-container-highest');
        }
        
        input[type="radio"]:checked + div .radio-indicator {
            border-color: theme('colors.primary');
        }
        
        input[type="radio"]:checked + div .radio-indicator::after {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background-color: theme('colors.primary');
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:max-w-[1200px] md:mx-auto relative">
<!-- Progress Bar (Top) -->
<div class="w-full px-container-margin pt-8 pb-4">
<div class="flex items-center justify-between mb-2">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant">Step 4 of 6</span>
<button aria-label="Skip this step" class="p-2 -mr-2 text-primary hover:bg-surface-container-low rounded-full transition-colors font-label-caps text-label-caps">Skip</button>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 66%;"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin py-section-gap flex flex-col items-center">
<!-- Header -->
<div class="w-full max-w-md mb-section-gap text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-4">Preferred pace</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose how quickly you'd like to reach your goal. A steadier pace is often easier to maintain.</p>
</div>
<!-- Options Grid -->
<div class="w-full max-w-md flex flex-col gap-4">
<!-- Conservative Option -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="pace" type="radio" value="conservative"/>
<div class="p-6 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 flex flex-col gap-2">
<div class="flex justify-between items-start mb-2">
<div>
<span class="font-headline-md text-headline-md text-on-background block">Conservative</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block mt-1">Recommended</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative"></div>
</div>
<div class="flex items-baseline gap-2">
<span class="font-metric-xl text-metric-xl text-primary">-0.25</span>
<span class="font-body-md text-body-md text-on-surface-variant">kg / week</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-sm">Gentle approach, easier to adapt dietary habits over time.</p>
</div>
</label>
<!-- Moderate Option -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="pace" type="radio" value="moderate"/>
<div class="p-6 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 flex flex-col gap-2">
<div class="flex justify-between items-start mb-2">
<div>
<span class="font-headline-md text-headline-md text-on-background block">Moderate</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative"></div>
</div>
<div class="flex items-baseline gap-2">
<span class="font-metric-xl text-metric-xl text-primary">-0.5</span>
<span class="font-body-md text-body-md text-on-surface-variant">kg / week</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-sm">Balanced pace requiring consistent effort and tracking.</p>
</div>
</label>
<!-- Aggressive Option -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="pace" type="radio" value="aggressive"/>
<div class="p-6 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 flex flex-col gap-2">
<div class="flex justify-between items-start mb-2">
<div>
<span class="font-headline-md text-headline-md text-on-background block">Aggressive</span>
<span class="inline-flex items-center gap-1 mt-1 font-label-caps text-label-caps text-tertiary">
<span class="material-symbols-outlined text-[16px]">warning</span> Requires discipline
                            </span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative"></div>
</div>
<div class="flex items-baseline gap-2">
<span class="font-metric-xl text-metric-xl text-primary">-1.0</span>
<span class="font-body-md text-body-md text-on-surface-variant">kg / week</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-sm">Strict adherence needed. May feel restrictive.</p>
</div>
</label>
</div>
<!-- Spacer for fixed bottom button -->
<div class="h-24 md:h-0 w-full shrink-0"></div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t from-background via-background to-transparent md:static md:bg-none md:pb-section-gap md:pt-0 flex justify-center z-40">
<div class="w-full max-w-md">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(0,108,73,0.2)]">
                Continue
            </button>
</div>
</div>
</body></html>
