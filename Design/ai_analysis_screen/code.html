<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nourish - AI Analysis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#313030",
                        "on-tertiary-fixed": "#410005",
                        "on-primary-container": "#00422b",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-surface": "#1c1b1b",
                        "surface-bright": "#fcf9f8",
                        "on-background": "#1c1b1b",
                        "on-secondary-fixed": "#2a1700",
                        "secondary-fixed-dim": "#ffb95f",
                        "primary-fixed": "#6ffbbe",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#002113",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-secondary-container": "#684000",
                        "surface-container-low": "#f6f3f2",
                        "inverse-on-surface": "#f3f0ef",
                        "secondary-container": "#fea619",
                        "primary": "#006c49",
                        "surface": "#fcf9f8",
                        "tertiary-fixed": "#ffdad7",
                        "surface-tint": "#006c49",
                        "on-surface-variant": "#3c4a42",
                        "primary-fixed-dim": "#4edea3",
                        "tertiary": "#a43a3a",
                        "on-tertiary-fixed-variant": "#842225",
                        "background": "#fcf9f8",
                        "on-primary-fixed-variant": "#005236",
                        "surface-container-high": "#eae7e7",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#4edea3",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "surface-variant": "#e5e2e1",
                        "surface-dim": "#dcd9d9",
                        "outline-variant": "#bbcabf",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#6c7a71",
                        "secondary": "#855300",
                        "on-tertiary-container": "#711419",
                        "error-container": "#ffdad6",
                        "primary-container": "#10b981",
                        "secondary-fixed": "#ffddb8",
                        "tertiary-container": "#fc7c78",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "40px",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "metric-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "metric-xl": ["40px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]

                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface antialiased w-full h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<div class="relative w-full h-full flex flex-col">
<!-- Blurred Background Layer -->
<div class="absolute inset-0 z-0 w-full h-full bg-cover bg-center transition-opacity duration-1000 scale-105" data-alt="A top-down, softly out-of-focus photograph of a beautifully presented, healthy Ethiopian meal on a modern ceramic plate. The lighting is natural, bright, and warm, emphasizing fresh greens, deep reds, and earthen tones against a clean, light-mode background. The overall aesthetic is premium, calm, and culinary." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB4gES8A2xK2suLXhxxaZoxpB-gKhUfPNIeAdv4gZeTB36QoSuOMN5Yi04TjAArGR2IXNJetqYndGow6GFQEuFpW8XnKx2_iclMYkwjWU9Zjh_GhGooM3wJ3uuOdfWz-naPUyn8qKIxjh1Wh-OjYMh7zuC-QA4990_WsK3oMTKJ80JvA1lEWWQsPqARtEg5b4sZ6s5hKoYM9J61Zct2bXi_AvIJj4oElB0yMTQoXdLCIj5eB0UU0ovB')">
</div>
<!-- Overlay to ensure text legibility while maintaining the elegant feel -->
<div class="absolute inset-0 z-0 bg-surface/80 backdrop-blur-2xl"></div>
<!-- Content Canvas -->
<div class="relative z-10 flex flex-col items-center justify-between h-full w-full max-w-[1200px] mx-auto px-container-margin py-section-gap">
<!-- Header: Subtle Logo Anchor -->
<header class="w-full flex justify-center py-6">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Nourish</h1>
</header>
<!-- Main Processing Area -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md gap-16">
<!-- Custom AI Animation Container (Pulsing Emerald Rings) -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Outer ambient pulse -->
<div class="absolute inset-0 rounded-full border border-primary/20 bg-primary/5 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<!-- Middle faster pulse -->
<div class="absolute inset-8 rounded-full border-2 border-primary/40 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite_0.5s]"></div>
<!-- Inner scanning core -->
<div class="relative z-10 w-24 h-24 bg-surface rounded-full shadow-[0_8px_32px_rgba(0,108,73,0.15)] border border-primary/10 flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-primary/0 via-primary/10 to-primary/0 animate-[translate-y-[-100%]_2s_linear_infinite]"></div>
<span class="material-symbols-outlined text-primary text-[40px]" data-weight="fill">
                            document_scanner
                        </span>
</div>
</div>
<!-- Status Sequence List -->
<div class="w-full flex flex-col gap-6">
<!-- Active Status -->
<div class="flex items-center gap-4 transition-all duration-300 opacity-100 translate-x-0">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-container text-[20px] animate-spin">
                                progress_activity
                            </span>
</div>
<div class="flex-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Finding foods...</h2>
</div>
</div>
<!-- Upcoming Status 1 -->
<div class="flex items-center gap-4 transition-all duration-300 opacity-40 translate-x-4">
<div class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">
                                radio_button_unchecked
                            </span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface-variant">Estimating portions...</h3>
</div>
</div>
<!-- Upcoming Status 2 -->
<div class="flex items-center gap-4 transition-all duration-300 opacity-40 translate-x-4">
<div class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">
                                radio_button_unchecked
                            </span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg text-on-surface-variant">Calculating nutrition...</h3>
</div>
</div>
</div>
</main>
<!-- Footer: Subtle context -->
<footer class="w-full py-6 flex justify-center">
<p class="font-label-caps text-label-caps text-outline uppercase tracking-[0.1em]">
                    Powered by Nourish Intelligence
                </p>
</footer>
</div>
</div>
</body></html>
