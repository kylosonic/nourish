name: website

# Validates the marketing site. Production delivery is handled by the Vercel
# project connected to this repository; GitHub Pages is not used.
#
# The site is static and reads releases/latest.json at runtime, so publishing a
# new APK never requires editing or rebuilding it.

on:
  push:
    paths:
      - 'apps/website/**'
      - 'releases/latest.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'apps/website/**'
      - 'releases/latest.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate site and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata is valid
        run: node scripts/generate-latest-json.mjs --check

      - name: Download-logic tests
        run: node --test "apps/website/test/*.test.mjs"

      - name: HTML validation
        run: npx --yes html-validate@9 "apps/website/*.html"

      # A link to a binary without a published checksum must never ship, and an
      # unsigned iOS artifact must never be offered (REL-04, master §65).
      - name: No install link may exist without a signed, checksummed asset
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const doc = JSON.parse(fs.readFileSync('releases/latest.json', 'utf8'));
          const problems = [];
          for (const [name, asset] of Object.entries({
            apk: doc.android?.apk,
            universal_apk: doc.android?.universal_apk,
            aab: doc.android?.aab,
            ipa: doc.ios?.ipa,
          })) {
            if (asset && !/^[0-9a-f]{64}$/.test(asset.sha256 ?? '')) {
              problems.push(`${name} is linked without a sha256`);
            }
          }
          if (doc.ios?.installable && !doc.ios?.ipa) {
            problems.push('ios.installable without a signed ipa');
          }
          if (!doc.ios?.installable && doc.ios?.ipa) {
            problems.push('an ipa is linked while ios.installable is false');
          }
          if (problems.length) {
            console.error(problems.join('\n'));
            process.exit(1);
          }
          console.log('release links are consistent with their checksums and signing state');
          NODE
