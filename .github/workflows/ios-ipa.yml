name: iOS unsigned IPA

# Why this workflow exists: an iOS .ipa can only be produced on macOS, and this
# project is developed on Windows. It builds the app with code signing disabled
# and publishes the result as a *development* artifact.
#
# An unsigned IPA is NOT installable on an iPhone: iOS refuses to install it.
# It is shipped so the build can be inspected and so a signed build can be
# produced later with the right certificates. Never present it as an installable
# iOS release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned iOS development IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # Each package is fetched from its own directory: `flutter pub get` needs a
      # pubspec in the working directory.
      - name: Packages
        run: |
          flutter pub get --directory packages/domain
          flutter pub get --directory packages/design-system
          flutter pub get --directory apps/mobile

      # `flutter build ipa --no-codesign` does not package an .ipa on current
      # Flutter (it leaves an .xcarchive), so the unsigned .app is built and the
      # Payload zip is assembled here - that is what an .ipa is.
      - name: Build the unsigned .app
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Package the .ipa and its checksum
        run: |
          set -euo pipefail
          APP=apps/mobile/build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "no unsigned .app was produced at $APP"; exit 1; }
          rm -rf build-ipa && mkdir -p build-ipa/Payload
          cp -R "$APP" build-ipa/Payload/
          mkdir -p release/ios
          (cd build-ipa && zip -qry "../release/ios/Nourish-v1.0.0-unsigned-development.ipa" Payload)
          cd release/ios
          shasum -a 256 Nourish-v1.0.0-unsigned-development.ipa | tee Nourish-v1.0.0-unsigned-development.ipa.sha256
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: nourish-ios-unsigned-ipa
          path: release/ios/
          # A green run with no .ipa would be worse than a red one.
          if-no-files-found: error
          retention-days: 30
