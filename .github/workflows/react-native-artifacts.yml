name: React Native Unsigned Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: v1.3.5
        type: string
      version:
        description: App version embedded in the build
        required: true
        default: 1.3.5
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  APP_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  EXPO_PUBLIC_API_URL: ${{ vars.NOURISH_API_URL }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}

jobs:
  verify:
    name: Verify React Native source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-rn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile-rn/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify release version
        run: |
          test "$(node -p "require('./app.json').expo.version")" = "$APP_VERSION"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: apps/mobile-rn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile-rn/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK with development signing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../release-assets
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "../../release-assets/Nourish-${APP_VERSION}.apk"
          APK_TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_TOOL" verify --verbose "../../release-assets/Nourish-${APP_VERSION}.apk"
          AAPT_TOOL="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          MANIFEST="$("$AAPT_TOOL" dump xmltree "../../release-assets/Nourish-${APP_VERSION}.apk" --file AndroidManifest.xml)"
          grep -q 'android.permission.POST_NOTIFICATIONS' <<< "$MANIFEST"
          grep -q 'expo.modules.notifications' <<< "$MANIFEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nourish-android-apk
          path: release-assets/Nourish-*.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    needs: verify
    defaults:
      run:
        working-directory: apps/mobile-rn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile-rn/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate iOS project and CocoaPods dependencies
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Nourish.xcworkspace \
            -scheme Nourish \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nourish.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/Nourish.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"
          plutil -p "$APP_PATH/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion'
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "../../release-assets"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          IPA="../../release-assets/Nourish-${APP_VERSION}-UNSIGNED.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$IPA"
          unzip -t "$IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nourish-ios-unsigned-ipa
          path: release-assets/Nourish-*-UNSIGNED.ipa
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - android
      - ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nourish-android-apk
          path: release-assets

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: nourish-ios-unsigned-ipa
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt

      - name: Show artifacts
        working-directory: release-assets
        run: ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nourish ${{ env.APP_VERSION }} — React Native Preview
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body: |
            ## Nourish ${{ env.APP_VERSION }} — React Native MVP

            Built from commit `${{ github.sha }}`.

            ### What’s new

            - Permission prompts are deferred until users choose camera/photo scanning or enable hydration reminders in settings.
            - Onboarding completes without requesting camera, photo-library, or notification access.
            - Email/password and Google account entry points, plus the existing phone OTP lane.
            - Smoother native screen transitions and a calmer floating-navigation indicator with no spring overshoot.
            - A slower, softer scan pulse and eased scan-stage changes, with reduced-motion preferences respected.
            - Camera/gallery scanner recovery that always offers manual food search.
            - Gram-level portion editing for search and scan results, including direct gram and kilogram adjustments.
            - Scheduled hydration notifications with an immediate confirmation notification.
            - Removed Describe Meal and Voice from the active scanning UI.
            - Shorter copy across onboarding, scan, history, insights, progress, and settings.

            ### Android

            `Nourish-${{ env.APP_VERSION }}.apk` is an installable release APK
            signed with the generated Android debug key. It is suitable for
            development and direct testing, not Play Store distribution.

            ### iOS

            `Nourish-${{ env.APP_VERSION }}-UNSIGNED.ipa` is an **unsigned iOS
            archive artifact**. It is not installable on a standard iPhone.
            Apple signing and an approved distribution channel are still
            required for TestFlight or App Store installation.

            ### Service requirements

            Automatic photo/text recognition and cloud account sign-in require a
            reachable Nourish API plus the public Google OAuth client IDs. If those
            repository variables are not configured, the app keeps offline search and
            logging available and offers manual food selection instead of inventing a
            result.

            ### Integrity

            Verify downloads with `SHA256SUMS.txt`.
          files: |
            release-assets/Nourish-${{ env.APP_VERSION }}.apk
            release-assets/Nourish-${{ env.APP_VERSION }}-UNSIGNED.ipa
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish-site-metadata:
    name: Publish build metadata to the website
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: nourish-android-apk
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nourish-ios-unsigned-ipa
          path: release-assets

      - name: Generate and validate website metadata
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.mjs \
            --version "$APP_VERSION" \
            --tag "$RELEASE_TAG" \
            --date "$(date -u +%F)" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --repository "$GITHUB_REPOSITORY" \
            --android-dir release-assets \
            --ios-dir release-assets \
            --flat-assets \
            --out apps/website/latest.json
          cp apps/website/latest.json releases/latest.json
          node scripts/generate-latest-json.mjs --check releases/latest.json

      - name: Commit website metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/latest.json releases/latest.json
          if git diff --cached --quiet; then
            echo "release metadata already current"
            exit 0
          fi
          git commit -m "chore(release): publish ${{ inputs.release_tag }} metadata"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
