name: Nourish Mobile Release

# Tag a release (master §68):
#   git tag v1.0.0 && git push origin v1.0.0
# Nothing is published unless analysis, tests and builds all pass (master §46).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  FLUTTER_CHANNEL: stable
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:

  test:
    name: Analyse and test (gate — nothing is published if this fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Packages
        run: |
          flutter pub get --directory packages/domain
          flutter pub get --directory packages/design-system
          flutter pub get --directory apps/mobile

      - name: Analyse
        run: |
          dart analyze packages/domain
          flutter analyze packages/design-system
          flutter analyze apps/mobile

      # Each suite runs inside its own package: `flutter test <path>` from the
      # repository root fails with "No pubspec.yaml file found".
      - name: Tests (domain)
        working-directory: packages/domain
        run: flutter test

      - name: Tests (design system)
        working-directory: packages/design-system
        run: flutter test

      - name: Tests (mobile)
        working-directory: apps/mobile
        run: flutter test

      - name: Release tooling tests (metadata + website download logic)
        run: |
          node --test "scripts/*.test.mjs"
          node --test "apps/website/test/*.test.mjs"

      - name: Validate the committed release metadata
        run: node scripts/generate-latest-json.mjs --check

  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Production signing is used only when the keystore secrets exist
      # (master §41). Without them the build is unsigned and is never presented
      # as a store-ready artifact.
      - name: Restore Android keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build unsigned (no keystore configured)
        if: ${{ steps.keystore.outputs.signed != 'true' }}
        working-directory: apps/mobile
        run: |
          echo "::warning::No Android keystore configured — building an UNSIGNED artifact. It is published as a development artifact only and must not be presented as a store or production build."
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Build signed
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        working-directory: apps/mobile
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          mkdir -p release/android
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             "release/android/Nourish-${tag}-universal.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "release/android/Nourish-${tag}-arm64.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "release/android/Nourish-${tag}-armeabi-v7a.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk \
             "release/android/Nourish-${tag}-x86_64.apk"
          cp apps/mobile/build/app/outputs/bundle/release/app-release.aab \
             "release/android/Nourish-${tag}.aab"
          ls -l release/android

      - name: Checksums
        working-directory: release/android
        run: sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nourish-android-${{ env.RELEASE_TAG }}
          path: release/android

  ios:
    name: Build iOS artifact
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      # Signing credentials are absent: build an archive-only artifact and say
      # so. An unsigned IPA is NOT installable on an iPhone and is never
      # advertised as such anywhere in the product (master §42/§65).
      - name: Build unsigned development artifact
        working-directory: apps/mobile
        run: |
          flutter build ipa --release --no-codesign || flutter build ios --release --no-codesign

      - name: Collect unsigned artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          mkdir -p release/ios
          if compgen -G "apps/mobile/build/ios/ipa/*.ipa" > /dev/null; then
            cp apps/mobile/build/ios/ipa/*.ipa "release/ios/Nourish-${tag}-UNSIGNED-DEVELOPMENT.ipa"
          else
            cp -R apps/mobile/build/ios/archive "release/ios/Nourish-${tag}-UNSIGNED-DEVELOPMENT.xcarchive"
          fi
          printf 'UNSIGNED / DEVELOPMENT ARTIFACT\n\nThis build is not signed for distribution and cannot be installed on an iPhone.\niOS distribution requires Apple signing and distribution approval.\n' \
            > "release/ios/READ-ME-FIRST.txt"
          ls -l release/ios

      # When Apple Developer Program credentials exist, add the signing steps
      # here (certificate import, provisioning profile, App Store Connect key)
      # and export a signed IPA. Expected secrets:
      #   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
      #   IOS_PROVISIONING_PROFILE_BASE64, IOS_KEYCHAIN_PASSWORD,
      #   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
      #   APP_STORE_CONNECT_PRIVATE_KEY_BASE64
      # Keep signing logic isolated from the Android job (master §66).

      - uses: actions/upload-artifact@v4
        with:
          name: nourish-ios-${{ env.RELEASE_TAG }}
          path: release/ios

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nourish-android-${{ env.RELEASE_TAG }}
          path: release/android

      - uses: actions/download-artifact@v4
        with:
          name: nourish-ios-${{ env.RELEASE_TAG }}
          path: release/ios

      - name: Release checksums (every published binary)
        shell: bash
        run: |
          set -euo pipefail
          find release -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -print0 \
            | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## Nourish ${{ env.RELEASE_TAG }}

            Download the arm64 APK for Android. Verify the SHA-256 in `SHA256SUMS.txt`
            before installing.

            The iOS artifact is an **unsigned development archive**. It is not
            installable on an iPhone; iOS distribution requires Apple signing and
            distribution approval.
          files: |
            release/android/*.apk
            release/android/*.aab
            release/ios/*
            release/SHA256SUMS.txt

  publish:
    name: Publish downloads and release metadata
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nourish-android-${{ env.RELEASE_TAG }}
          path: release/android

      - uses: actions/download-artifact@v4
        with:
          name: nourish-ios-${{ env.RELEASE_TAG }}
          path: release/ios

      # The canonical metadata document is generated by the repository's own
      # script (REL-01), so the pipeline and the tests share one definition.
      - name: Generate latest.json
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          node scripts/generate-latest-json.mjs \
            --version "${RELEASE_TAG#v}" \
            --tag "${RELEASE_TAG}" \
            --date "$(date -u +%F)" \
            --base-url "${R2_PUBLIC_BASE_URL}" \
            --repository "${GITHUB_REPOSITORY}" \
            --android-dir release/android \
            --ios-dir release/ios \
            --out releases/latest.json

      - name: Upload Android files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          npm install --global wrangler
          for file in release/android/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            echo "uploading android/${name}"
            wrangler r2 object put "${R2_BUCKET_NAME}/android/${name}" \
              --file "$file" --remote
          done

      - name: Upload iOS files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for file in release/ios/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            echo "uploading ios/${name}"
            wrangler r2 object put "${R2_BUCKET_NAME}/ios/${name}" \
              --file "$file" --remote
          done

      - name: Publish metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.mjs --check releases/latest.json
          wrangler r2 object put "${R2_BUCKET_NAME}/metadata/latest.json" \
            --file releases/latest.json \
            --content-type "application/json" \
            --remote

      # The website serves the same document from its own origin, so a new
      # release never needs a website rebuild (master §52).
      - name: Commit the metadata back to the default branch
        run: |
          set -euo pipefail
          if git diff --quiet -- releases/latest.json; then
            echo "metadata unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/latest.json
          git commit -m "chore(release): publish ${RELEASE_TAG} metadata"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Summary
        run: |
          {
            echo "### Nourish ${RELEASE_TAG}"
            echo
            echo "- Android download base: \`${{ secrets.R2_PUBLIC_BASE_URL }}/android/\`"
            echo "- Metadata: \`${{ secrets.R2_PUBLIC_BASE_URL }}/metadata/latest.json\`"
            echo "- GitHub Release: \`https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
