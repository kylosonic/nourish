name: React Native Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile-rn/**"
      - ".github/workflows/react-native-ci.yml"
  push:
    branches:
      - "feat/nourish-mvp"
    paths:
      - "apps/mobile-rn/**"
      - ".github/workflows/react-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-rn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-rn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Export production web bundle
        run: npx expo export --platform web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: nourish-react-native-web
          path: apps/mobile-rn/dist
          if-no-files-found: error
