name: api-ci

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

defaults:
  run:
    working-directory: apps/api

# Variables Prisma and env validation need in every job. Locally they live in the
# gitignored .env, which is why these steps failed in CI; the e2e job overrides
# DATABASE_URL with its own service container.
env:
  DATABASE_URL: postgresql://nourish:nourish@localhost:5432/nourish_test?schema=public
  CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
  JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
  SMS_PROVIDER: console
  AI_PROVIDER: fixture

jobs:
  lint:
    name: Lint (strict TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    name: Build + Prisma validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx prisma validate

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test

  test-e2e:
    name: E2E tests (Postgres service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nourish
          POSTGRES_PASSWORD: nourish
          # The e2e harness connects to nourish_test (TEST_DATABASE_URL below); a
          # container created with only POSTGRES_DB=nourish made globalSetup fail
          # before any test ran, which is why this job was red from its first run.
          POSTGRES_DB: nourish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nourish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nourish:nourish@localhost:5432/nourish_test?schema=public
      TEST_DATABASE_URL: postgresql://nourish:nourish@localhost:5432/nourish_test?schema=public
      # Test-only values: the SMS factory refuses the console provider in
      # production, so these cannot reach a deployment.
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      SMS_PROVIDER: console
      AI_PROVIDER: fixture
      # Required by env validation and present locally only in the gitignored
      # .env, so CI failed before running a single test.
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # QA finding F-15: a transient registry socket error used to fail this
      # gate spuriously. Retry once, then fail for real.
      - name: npm audit (high and above)
        run: |
          npm audit --audit-level=high || {
            echo "::warning::first audit attempt failed — retrying once";
            sleep 5;
            npm audit --audit-level=high;
          }
